databases:
  - name: harryjoseph
    databaseName: harryjoseph
    user: harryjoseph

services:
  - type: web
    name: harryjoseph-portfolio
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn harryjoseph.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harryjoseph
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4